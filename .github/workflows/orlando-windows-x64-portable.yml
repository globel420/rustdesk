name: Orlando RustDesk Windows x64 portable

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: orlando-rustdesk-windows-x64-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_EXPAND_VERSION: "1.0.95"
  FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
  FLUTTER_VERSION: "3.24.5"
  FLUTTER_BRIDGE_VERSION: "3.22.3"
  LLVM_VERSION: "15.0.6"
  RUST_VERSION: "1.75"
  VERSION: "1.4.9"
  WINDOWS_X64_ENGINE_SHA256: "ec8cabf36ee4ff24c8d98de25b00e70781eb03876265aee84d0fe554a110036e"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "120deac3062162151622ca4860575a33844ba10b"

jobs:
  generate-bridge:
    name: Generate Flutter bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Install prerequisites
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang \
            cmake \
            gcc \
            g++ \
            libclang-dev \
            libgtk-3-dev \
            llvm-dev \
            nasm \
            ninja-build \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-gnu
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: orlando-bridge-ubuntu-22.04

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_BRIDGE_VERSION }}
          cache: true

      - name: Generate bridge files
        shell: bash
        run: |
          cargo install cargo-expand --version "${CARGO_EXPAND_VERSION}" --locked
          cargo install flutter_rust_bridge_codegen \
            --version "${FLUTTER_RUST_BRIDGE_VERSION}" \
            --features uuid \
            --locked
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
          pushd flutter
          flutter pub get
          popd
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

      - name: Upload bridge files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: orlando-bridge-artifact
          if-no-files-found: error
          retention-days: 1
          path: |
            ./src/bridge_generated.rs
            ./src/bridge_generated.io.rs
            ./flutter/lib/generated_bridge.dart
            ./flutter/lib/generated_bridge.freezed.dart
            ./flutter/macos/Runner/bridge_generated.h
            ./flutter/ios/Runner/bridge_generated.h

  build-windows-x64:
    name: Build Windows x64 portable EXE
    needs: generate-bridge
    runs-on: windows-2022
    timeout-minutes: 150
    steps:
      - name: Export GitHub Actions cache variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: orlando-bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0 # v2.0.9
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        id: flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Install RustDesk Flutter engine
        shell: pwsh
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest `
            -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip `
            -OutFile windows-x64-release.zip
          $engineHash = (Get-FileHash -Path windows-x64-release.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($engineHash -ne $env:WINDOWS_X64_ENGINE_SHA256) {
            throw "RustDesk Flutter engine checksum mismatch."
          }
          Expand-Archive `
            -Path windows-x64-release.zip `
            -DestinationPath windows-x64-release
          $engine = "${{ steps.flutter.outputs['CACHE-PATH'] }}\bin\cache\artifacts\engine\windows-x64-release"
          Copy-Item -Recurse -Force .\windows-x64-release\* $engine

      - name: Apply RustDesk Flutter patch
        shell: bash
        run: |
          flutter_root="$(dirname "$(dirname "$(which flutter)")")"
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff "$flutter_root/"
          pushd "$flutter_root"
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
          popd

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: orlando-windows-2022-x64

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        env:
          VCPKG_DEFAULT_HOST_TRIPLET: x64-windows-static
        run: |
          if ! "$VCPKG_ROOT/vcpkg" \
            install \
            --triplet x64-windows-static \
            --x-install-root="$VCPKG_ROOT/installed"; then
            find "$VCPKG_ROOT" -name "*.log" -print -exec cat {} \;
            exit 1
          fi

      - name: Build complete Flutter portable directory
        shell: pwsh
        run: |
          python3 .\build.py `
            --portable `
            --flutter `
            --skip-portable-pack `
            --hwcodec `
            --vram
          Move-Item `
            .\flutter\build\windows\x64\runner\Release `
            .\rustdesk

      - name: Verify required runtime dependencies
        shell: pwsh
        run: |
          $required = @(
            ".\rustdesk\rustdesk.exe",
            ".\rustdesk\flutter_windows.dll",
            ".\rustdesk\librustdesk.dll"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file -PathType Leaf)) {
              throw "Required runtime file is missing: $file"
            }
          }
          $fileSelector = Get-ChildItem `
            -Path .\rustdesk `
            -Filter "*file_selector*.dll" `
            -File
          if (-not $fileSelector) {
            throw "The Flutter file-selector plugin DLL is missing from the portable directory."
          }
          Get-ChildItem .\rustdesk -File | Sort-Object Name | Format-Table Name, Length

      - name: Test empty IPC failure behavior
        shell: pwsh
        run: |
          $stdout = Join-Path $env:RUNNER_TEMP "temporary-password-stdout.txt"
          $stderr = Join-Path $env:RUNNER_TEMP "temporary-password-stderr.txt"
          $process = Start-Process `
            -FilePath .\rustdesk\rustdesk.exe `
            -ArgumentList "--get-temporary-password" `
            -NoNewWindow `
            -Wait `
            -PassThru `
            -RedirectStandardOutput $stdout `
            -RedirectStandardError $stderr
          if ($process.ExitCode -ne 1) {
            throw "Expected no-listener exit code 1, got $($process.ExitCode)."
          }
          if ((Get-Item $stdout).Length -ne 0) {
            throw "The failed password query unexpectedly wrote to stdout."
          }

      - name: Copy Windows version resource
        continue-on-error: true
        shell: bash
        run: |
          runner_res="$(find . -name Runner.res -print -quit)"
          if [[ -n "$runner_res" ]]; then
            cp "$runner_res" ./libs/portable/Runner.res
          fi

      - name: Build self-extracting portable EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          python3 -m pip install -r requirements.txt
          python3 ./generate.py \
            -f ../../rustdesk/ \
            -o . \
            -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./dist
          mv ./target/release/rustdesk-portable-packer.exe \
            "./dist/Orlando-RustDesk-${VERSION}-windows-x64-portable.exe"

      - name: Record artifact checksum
        shell: pwsh
        run: |
          $exe = ".\dist\Orlando-RustDesk-${env:VERSION}-windows-x64-portable.exe"
          $hash = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "SHA256: $hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Upload unsigned portable EXE
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Orlando-RustDesk-${{ env.VERSION }}-windows-x64-portable-unsigned
          path: ./dist/Orlando-RustDesk-${{ env.VERSION }}-windows-x64-portable.exe
          if-no-files-found: error
          retention-days: 14
